# =============================================================================
# Nginx Reverse Proxy Configuration for DevOps Infrastructure
# Routes all services through localhost:80
# =============================================================================

upstream grafana {
    server localhost:3000;
}
upstream prometheus {
    server localhost:9090;
}
upstream kibana {
    server localhost:5601;
}
upstream jenkins {
    server localhost:8081;
}
upstream gitlab {
    server localhost:8082;
}
upstream argocd {
    server localhost:8083;
}
upstream sonarqube {
    server localhost:9000;
}
upstream vault {
    server localhost:8200;
}
upstream consul {
    server localhost:8500;
}
upstream rabbitmq {
    server localhost:15672;
}
upstream nexus {
    server localhost:8084;
}
upstream keycloak {
    server localhost:8085;
}
upstream traefik_dashboard {
    server localhost:8090;
}
upstream minio_console {
    server localhost:9002;
}
upstream alertmanager {
    server localhost:9093;
}

# Main server block
server {
    listen 80;
    server_name localhost *.local;

    # Health check endpoint
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Grafana
    location /grafana/ {
        proxy_pass http://grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus
    location /prometheus/ {
        proxy_pass http://prometheus/;
        proxy_set_header Host $host;
    }

    # Kibana
    location /kibana/ {
        proxy_pass http://kibana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Jenkins
    location /jenkins/ {
        proxy_pass http://jenkins/jenkins/;
        proxy_redirect default;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ArgoCD
    location /argocd/ {
        proxy_pass http://argocd/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Vault
    location /vault/ {
        proxy_pass http://vault/;
        proxy_set_header Host $host;
    }

    # Consul UI
    location /consul/ {
        proxy_pass http://consul/;
        proxy_set_header Host $host;
    }

    # RabbitMQ Management
    location /rabbitmq/ {
        rewrite ^/rabbitmq/(.*)$ /$1 break;
        proxy_pass http://rabbitmq;
        proxy_set_header Host $host;
    }

    # Nexus
    location /nexus/ {
        proxy_pass http://nexus/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 500m;
    }

    # MinIO Console
    location /minio/ {
        proxy_pass http://minio_console/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1000m;
    }

    # Alertmanager
    location /alertmanager/ {
        proxy_pass http://alertmanager/;
        proxy_set_header Host $host;
    }

    # Default - show dashboard
    location / {
        return 200 '<html><head><title>DevOps Dashboard</title></head><body>
<h1>DevOps Infrastructure</h1>
<ul>
<li><a href="/grafana/">Grafana</a> (port 3000)</li>
<li><a href="/prometheus/">Prometheus</a> (port 9090)</li>
<li><a href="/kibana/">Kibana</a> (port 5601)</li>
<li><a href="/jenkins/">Jenkins</a> (port 8081)</li>
<li><a href="/argocd/">ArgoCD</a> (port 8083)</li>
<li><a href="/vault/">Vault</a> (port 8200)</li>
<li><a href="/consul/">Consul</a> (port 8500)</li>
<li><a href="/rabbitmq/">RabbitMQ</a> (port 15672)</li>
<li><a href="/nexus/">Nexus</a> (port 8084)</li>
<li><a href="/minio/">MinIO Console</a> (port 9002)</li>
</ul>
</body></html>';
        add_header Content-Type text/html;
    }
}
