apiVersion: 1

providers:
  - name: DevOps Infrastructure
    orgId: 1
    folder: DevOps
    folderUid: devops-infra
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
