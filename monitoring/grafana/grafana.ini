#################################### Grafana Configuration ##################
# DevOps Infrastructure - Local Environment

[DEFAULT]
# Used to sign requests. Change in production.
instance_name = devops-grafana

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
domain = localhost
enforce_domain = false
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false

[database]
type = sqlite3
path = grafana.db

[cache]
type = memory

[remote_cache]
type = database
[security]
admin_user = ${GF_SECURITY_ADMIN_USER:-admin}
admin_password = ${GF_SECURITY_ADMIN_PASSWORD:-admin}
secret_key = SW2YcwTIb9zpOOhoPsMm
disable_gravatar = true
cookie_secure = false
cookie_samesite = lax
# Allow embedding in iframes (for dashboards in docs)
allow_embedding = true
# Disable brute force protection for local dev
login_maximum_inactive_lifetime_days = 30
login_maximum_lifetime_days = 365

[snapshots]
external_enabled = false

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_id = 1
auto_assign_org_role = Editor
default_theme = dark

[auth]
login_cookie_name = grafana_session
login_maximum_inactive_lifetime_days = 30
login_maximum_lifetime_days = 365
token_rotation_interval_minutes = 10
disable_login_form = false
disable_signout_menu = false

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
hide_version = false

[auth.basic]
enabled = true

[smtp]
enabled = false
host = localhost:25
from_address = grafana@example.com
from_name = Grafana

[alerting]
#enabled = true
execute_alerts = true
error_or_timeout = alerting
nodata_or_nullvalues = no_data
concurrent_render_limit = 5

[unified_alerting]
enabled = true
execute_alerts = true

[explore]
enabled = true

[feature_toggles]
enable = ngalert

[log]
mode = console file
level = warn
filters = rendering:debug

[log.console]
level = warn
format = json

[log.file]
level = warn
format = json
log_rotate = true
max_lines = 1000000
max_size_shift = 28
daily_rotate = true
max_days = 7

[metrics]
enabled = true
interval_seconds = 10
disable_total_stats = false

[grafana_net]
url = https://grafana.net

[tracing.jaeger]
address =
always_propagate_trace_id = false

[panels]
disable_sanitize_html = true

[plugins]
allow_loading_unsigned_plugins =
plugin_admin_enabled = true
