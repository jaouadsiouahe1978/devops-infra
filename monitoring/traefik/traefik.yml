## Traefik Static Configuration
## DevOps Infrastructure - Local Environment

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop

api:
  dashboard: true
  insecure: true  # OK for local dev, disable in prod

entryPoints:
  web:
    address: ":8086"
    http:
      redirections:
        entrypoint:
          to: websecure
          scheme: https
          permanent: false
  websecure:
    address: ":8443"
  dashboard:
    address: ":8090"
  metrics:
    address: ":8082"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: devops-network
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true
    entryPoint: metrics
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0

certificatesResolvers:
  localCA:
    acme:
      email: admin@local.dev
      storage: /etc/traefik/acme.json
      tlsChallenge: {}
