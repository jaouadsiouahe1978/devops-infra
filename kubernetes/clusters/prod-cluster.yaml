apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: prod
servers: 1
agents: 3
image: rancher/k3s:v1.29.0-k3s1
network: devops-k8s-prod
ports:
  - port: 30201-30300:30201-30300
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: 60s
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
