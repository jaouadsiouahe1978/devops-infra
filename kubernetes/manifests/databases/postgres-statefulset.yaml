# =============================================================================
# postgres-statefulset.yaml — PostgreSQL 15 on Kubernetes (StatefulSet)
# Namespace: databases
# Apply with: kubectl apply -f kubernetes/manifests/databases/postgres-statefulset.yaml
# =============================================================================

# ---------------------------------------------------------------------------
# Secret — base64-encoded credentials
# Generate your own:  echo -n 'yourpassword' | base64
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: devops-postgres-secret
  namespace: databases
  labels:
    app: postgres
    managed-by: devops-infra
type: Opaque
data:
  # Default values below are for local dev only — NEVER use in production as-is.
  # postgres        (base64)
  POSTGRES_DB: cG9zdGdyZXM=
  # devops_admin    (base64)
  POSTGRES_USER: ZGV2b3BzX2FkbWlu
  # D3v0ps$ecure!   (base64)
  POSTGRES_PASSWORD: RDN2MHBzJGVjdXJlIQ==
---
# ---------------------------------------------------------------------------
# StatefulSet
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: databases
  labels:
    app: postgres
    managed-by: devops-infra
    version: "15"
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        version: "15"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: devops-postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: postgres
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
# ---------------------------------------------------------------------------
# Headless Service — required by StatefulSet for stable DNS entries
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: databases
  labels:
    app: postgres
    managed-by: devops-infra
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# ---------------------------------------------------------------------------
# ClusterIP Service — internal cluster access
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: databases
  labels:
    app: postgres
    managed-by: devops-infra
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# ---------------------------------------------------------------------------
# NodePort Service — external access from host machine (port 30532)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres-nodeport
  namespace: databases
  labels:
    app: postgres
    managed-by: devops-infra
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30532
