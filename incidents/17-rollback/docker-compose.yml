version: "3.8"

services:
  app-v1:
    image: nginx:1.24-alpine
    container_name: incident-app-v1
    labels:
      app.version: "1.0.0"
      app.status: "stable"
    volumes:
      - ./v1:/usr/share/nginx/html:ro
    ports:
      - "18082:80"

  app-v2-broken:
    image: nginx:alpine
    container_name: incident-app-v2-broken
    labels:
      app.version: "2.0.0"
      app.status: "broken"
    volumes:
      - ./v2:/usr/share/nginx/html:ro
    ports:
      - "18083:80"
    command: >
      sh -c "
        echo '[INCIDENT-17] Deploying broken v2...';
        nginx -g 'daemon off;' &
        sleep 3;
        echo '[v2] Simulating crash after startup...';
        kill 1
      "
