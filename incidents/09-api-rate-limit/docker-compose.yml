version: "3.8"

services:
  rate-limited-api:
    image: nginx:alpine
    container_name: incident-rate-limit-api
    volumes:
      - ./nginx-ratelimit.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18081:80"

  api-spammer:
    image: alpine:latest
    container_name: incident-rate-limit-client
    depends_on:
      - rate-limited-api
    command: >
      sh -c "
        apk add -q curl;
        sleep 2;
        echo '[INCIDENT-09] Sending rapid API requests...';
        i=0;
        while true; do
          i=\$((i+1));
          STATUS=\$(curl -s -o /dev/null -w '%{http_code}' http://rate-limited-api/api/data);
          if [ \"\$STATUS\" = '429' ]; then
            echo \"[RATE LIMITED] Request \$i: 429 Too Many Requests\";
          else
            echo \"[OK] Request \$i: \$STATUS\";
          fi;
          sleep 0.1;
        done
      "
