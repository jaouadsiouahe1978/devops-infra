version: "3.8"

services:
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: nginx-proxy
    ports:
      - "8181:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    external: true
    name: devops-monitoring
