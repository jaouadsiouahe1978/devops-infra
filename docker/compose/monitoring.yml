name: devops-monitoring

networks:
  monitoring:
    external: true
    name: devops-monitoring

volumes:
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-~/devops-infra/data}/prometheus
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-~/devops-infra/data}/grafana
  alertmanager-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-~/devops-infra/data}/alertmanager

services:
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.enable-remote-write-receiver'
    volumes:
      - prometheus-data:/prometheus
      - ${HOME}/devops-infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${HOME}/devops-infra/monitoring/prometheus/rules:/etc/prometheus/rules:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_FEATURE_TOGGLES_ENABLE=ngalert
    volumes:
      - grafana-data:/var/lib/grafana
      - ${HOME}/devops-infra/monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ${HOME}/devops-infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${HOME}/devops-infra/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - monitoring
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--cluster.advertise-address=0.0.0.0:9093'
    volumes:
      - alertmanager-data:/alertmanager
      - ${HOME}/devops-infra/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - monitoring
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--web.listen-address=:9100'
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - monitoring
    mem_limit: 128m
    cpus: 0.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8088:8080"
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus exporters for databases
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-devops}:${POSTGRES_PASSWORD:-DevOps2024!}@host.docker.internal:5432/${POSTGRES_DB:-devopsdb}?sslmode=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    mem_limit: 64m
    profiles:
      - exporters

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://host.docker.internal:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-DevOps2024!Redis}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    mem_limit: 64m
    profiles:
      - exporters

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx-exporter
    restart: unless-stopped
    ports:
      - "9113:9113"
    command:
      - -nginx.scrape-uri=http://host.docker.internal:80/nginx_status
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    mem_limit: 32m
    profiles:
      - exporters

  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysql-exporter
    restart: "no"
    ports:
      - "9104:9104"
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${MYSQLD_EXPORTER_PASSWORD:-DevOps2024!}
      - DATA_SOURCE_NAME=${MYSQL_DATA_SOURCE_NAME:-exporter:DevOps2024!@(host.docker.internal:3306)/}
    networks:
      - monitoring
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9104/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter
    restart: "no"
    ports:
      - "9216:9216"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://host.docker.internal:27017}
    networks:
      - monitoring
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9216/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    restart: "no"
    ports:
      - "9308:9308"
    command:
      - --kafka.server=kafka:9092
    networks:
      - monitoring
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9308/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: blackbox-exporter
    restart: "no"
    ports:
      - "9115:9115"
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ${HOME}/devops-infra/monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - monitoring
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9115/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
    container_name: elasticsearch-exporter
    restart: "no"
    ports:
      - "9114:9114"
    environment:
      - ES_URI=${ES_URI:-http://host.docker.internal:9200}
    networks:
      - monitoring
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9114/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
