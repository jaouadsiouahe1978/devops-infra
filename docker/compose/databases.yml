name: devops-databases

networks:
  databases:
    driver: bridge
    name: devops-databases

services:
  postgres:
    image: postgres:15.6-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DevOps2024!}
      POSTGRES_DB: ${POSTGRES_DB:-devopsdb}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ${DATA_ROOT:-~/devops-infra/data}/postgres:/var/lib/postgresql/data
    networks:
      - databases
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-devops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  mysql:
    image: mysql:8.0.37
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-DevOps2024!Root}
      MYSQL_USER: ${MYSQL_USER:-devops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-DevOps2024!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devopsdb}
    volumes:
      - ${DATA_ROOT:-~/devops-infra/data}/mysql:/var/lib/mysql
    networks:
      - databases
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-DevOps2024!Root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-DevOps2024!Redis}
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 900 1
      --save 300 10
    volumes:
      - ${DATA_ROOT:-~/devops-infra/data}/redis:/data
    networks:
      - databases
    mem_limit: 640m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-DevOps2024!Redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  mongodb:
    image: mongo:7.0.8
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-DevOps2024!Mongo}
    volumes:
      - ${DATA_ROOT:-~/devops-infra/data}/mongodb:/data/db
    networks:
      - databases
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
