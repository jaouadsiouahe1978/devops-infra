name: devops-bastion

networks:
  bastion:
    driver: bridge
    name: devops-bastion

services:
  bastion:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-bastion:latest
    container_name: devops-bastion
    hostname: bastion-prod
    restart: unless-stopped

    ports:
      - "2222:22"
      - "8080:8080"

    environment:
      TZ: UTC
      DOCKER_HOST_IP: "172.20.255.24"

    volumes:
      - /home/jaouad/devops-infra:/infra:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/rancher/k3s:/k3s-kubeconfig:ro
      - /home/jaouad/.ssh/id_rsa.pub:/authorized_keys:ro
      - bastion-audit-logs:/var/log/bastion
      - bastion-mfa-data:/home/devops

    cap_add:
      - NET_ADMIN
      - NET_RAW

    security_opt:
      - no-new-privileges:false

    mem_limit: 512m
    memswap_limit: 512m

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  bastion-audit-logs:
    name: bastion-audit-logs
  bastion-mfa-data:
    name: bastion-mfa-data
